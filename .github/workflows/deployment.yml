# Mesin-Waktu-Games
# Alur otomatis:
#  1. Jika ada update.zip di root repo -> isinya diekstrak & ditimpa ke repo,
#     update.zip dihapus, lalu di-commit + push otomatis.
#  2. Setelah itu project di-build dan di-deploy ke GitHub Pages.
name: Update dan Deploy

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Terapkan update.zip (jika ada)
        run: |
          if [ ! -f update.zip ]; then
            echo "Tidak ada update.zip, lewati."
            exit 0
          fi

          rm -rf /tmp/upd && mkdir /tmp/upd
          unzip -q update.zip -d /tmp/upd
          rm -rf /tmp/upd/__MACOSX

          # Jika isi zip dibungkus 1 folder (mis. repo-master/), masuk ke folder itu
          cd /tmp/upd
          if [ "$(ls -A | wc -l)" = "1" ] && [ -d "$(ls -A | head -n1)" ]; then
            cd "$(ls -A | head -n1)"
          fi

          # .github/ dilewati karena GITHUB_TOKEN tidak boleh mengubah workflow
          rsync -a --exclude='.github/' --exclude='.git/' --exclude='update.zip' ./ "$GITHUB_WORKSPACE"/

          cd "$GITHUB_WORKSPACE"
          git rm -q --ignore-unmatch update.zip
          rm -f update.zip

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "chore: terapkan update.zip"
            git push
          fi

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (versi terbaru setelah update)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
